services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsletter_secret}
      POSTGRES_DB: ${POSTGRES_DB:-newsletter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsletter} -d ${POSTGRES_DB:-newsletter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── AI Newsletter App ───────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Datenbank (zeigt auf den db-Service im selben Compose-Netz)
      DATABASE_URL: postgresql://${POSTGRES_USER:-newsletter}:${POSTGRES_PASSWORD:-newsletter_secret}@db:5432/${POSTGRES_DB:-newsletter}
      # Admin-Login & Sessions (in Coolify setzen!)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-to-a-long-random-string-min-32-chars}
      # KI-API: OPTIONAL — kann auch direkt in der Admin-UI eingegeben werden.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      TEST_MODE: ${TEST_MODE:-false}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
